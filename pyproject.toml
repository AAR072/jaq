[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "jaq-investigator"
version = "0.1.0"
description = "Bounded evidence investigator for JAQ static PE analysis"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
llm = ["litellm>=1.70,<2"]
dev = ["pytest>=8,<9"]

[project.scripts]
jaq-investigator = "jaq_investigator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["python/jaq_investigator"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
addopts = "-q"
pythonpath = ["python"]
